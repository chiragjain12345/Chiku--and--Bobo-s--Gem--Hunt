<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E">
<title>Chiku and Bobo's Gem Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1795170105">
<link rel="stylesheet" href="css/level2.css?v=1795170105">
</head>
<body>
<div id="app">
  <main id="stage" aria-live="polite">

    <!-- ================= STORY ================= -->
    <section id="story" class="layer">
      <div class="bgwrap"><img id="storyBg" class="bg" alt=""><img id="storyBg2" class="bg" alt=""><div id="storyRig" class="rigLayer"></div></div>
      <div id="titleCard" hidden>
        <button class="plankBtn big" id="btnPlay">Play</button>
      </div>
      <div id="bubble" class="bubble" hidden><p id="bubbleText"></p></div>
      <div id="narration" hidden></div>
      <button class="plankBtn small" id="btnSkip" hidden>Skip story ▸▸</button>
    </section>

    <!-- ================= GAME ================= -->
    <section id="game" class="layer" hidden>
      <img class="bg full" src="assets/images/backgrounds/game_bg.jpg" alt="">
      <div class="vignette"></div>
      <header id="hud">
        <div class="hudRight">
          <button id="btnMute" class="roundBtn" aria-label="Sound on" hidden>🔊</button>
          <label class="chamberSel"><span class="sr">Jump to chamber</span><select id="jump"></select></label>
        </div>
      </header>
      <div id="vo"><div id="voAv" class="av"></div><p id="voLine"></p></div>
      <div id="fb" hidden></div>
      <div id="wall"></div>
      <div id="actions"><button class="plankBtn" id="btnAgain" hidden>Cut again</button></div>
      <div id="train"></div>
      <div id="dim" hidden></div>
      <div id="board" class="board" hidden></div>
    </section>

    <!-- ================= LEVEL 2 ================= -->
    <section id="lvl2" class="layer" hidden>
      <img class="bg full" src="assets/images/backgrounds/level2_bg.jpg" alt="">
      <div id="l2BgPatch" aria-hidden="true"></div>
      <div id="l2Plank"></div>
      <div id="l2Prog"></div>
      <div id="l2Count" hidden></div>
      <div id="l2Stones"></div>
      <div id="l2Cart"><div class="load"></div><img src="assets/images/props/trolley.png" alt=""></div>
      <div id="l2Chiku" class="idle"></div>
      <div id="l2Say" hidden><p></p></div>
      <button id="l2Pause" aria-label="Pause"><i></i><i></i></button>
      <button id="l2Done" disabled>DONE</button>
      <div id="l2Keys" hidden><div id="l2keys"></div></div>
      <div id="l2Ride" hidden></div>
      <div id="l2Dim" hidden></div>
      <div id="l2Board" class="board" hidden></div>
      <div id="l2Paused" hidden><h2>Paused</h2><button class="plankBtn big" id="l2Resume">Resume</button></div>
    </section>

    <!-- ================= TRANSITIONS ================= -->
    <section id="tunnel" class="layer" hidden>
      <div id="tunnelCap" class="capPlank"></div>
    </section>
    <canvas id="torch" width="1920" height="1080" hidden></canvas>
    <div id="fade" hidden></div>

    <div id="hand" hidden><svg viewBox="0 0 100 120" aria-hidden="true"><path d="M30 8c6 0 10 5 10 11v34l4-1c2-6 14-6 16 1 3-5 13-4 15 3 4-4 14-1 14 7v22c0 20-14 33-32 33H50c-12 0-20-6-26-16L8 74c-4-6-1-13 6-14 4 0 8 2 10 5l-4-48c0-7 4-11 10-11z" fill="#fff" stroke="#3b2414" stroke-width="5" stroke-linejoin="round"/><path d="M44 52v18M60 54v16M75 58v13" stroke="#c9b9a6" stroke-width="3" stroke-linecap="round"/></svg></div>
  </main>
</div>

<!-- shared SVG defs (stone texture + gem gradients) -->
<svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defsInner"></defs></svg>

<script src="js/game.js?v=1795170105"></script>
<script src="js/teach_improper.js?v=1795170105"></script>
<script src="js/level2.js?v=1795170105"></script>
<script src="js/level2_story.js?v=1795170105"></script>
<!-- TEMPORARY dev menu (open with ?dev=1). Delete this line + js/devmenu.js when the game is finished. -->
<script src="js/devmenu.js?v=1795170105"></script>
</body>
</html>
